<!doctype html>
<html lang="en"><head>
<script>
// Keep the game running when the browser stops giving it frames: a hidden tab, a window covered by another one,
// a minimised window (Nitro Wreckers keep-alive). Frozen frames froze an online host and everyone in its room
// ("WAITING FOR THE HOST..."). A tiny probe notices when frames stop for 1/4 s; a worker timer then drives the
// game at ~30 frames a second until normal frames come back. Normal play is untouched.
(function(){
  if(!window.Worker||!window.Blob||!window.URL||!window.Map)return;
  var raf=window.requestAnimationFrame.bind(window),caf=window.cancelAnimationFrame.bind(window);
  var pending=new Map(),lastFrame=performance.now();
  function probe(){lastFrame=performance.now();raf(probe);}raf(probe);
  window.requestAnimationFrame=function(cb){
    var e={cb:cb,done:false};
    e.id=raf(function(t){if(e.done)return;e.done=true;pending.delete(e.id);cb(t);});
    pending.set(e.id,e);return e.id;
  };
  window.cancelAnimationFrame=function(id){var e=pending.get(id);if(e){e.done=true;pending.delete(id);}caf(id);};
  try{
    var worker=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},33)'],{type:'text/javascript'})));
    worker.onmessage=function(){
      var now=performance.now();if(now-lastFrame<250||pending.size===0)return;
      var list=Array.from(pending.values());pending.clear();
      for(var i=0;i<list.length;i++){var e=list[i];e.done=true;caf(e.id);try{e.cb(now);}catch(err){console.error(err);}}
    };
  }catch(err){}
})();
</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nitro Wreckers</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1315;color:#f1efd7;font-family:Arial,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;outline:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0b1315;z-index:2}
h1{font-size:clamp(32px,7vw,80px);margin:0 0 16px;color:#ffc324;letter-spacing:-2px}
progress{width:min(420px,75vw);height:10px;accent-color:#42d4c4}p{font-size:14px}
#error{max-width:700px;padding:24px;white-space:pre-wrap}
</style></head><body>
<div id="loading"><h1>NITRO WRECKERS</h1><p>Loading the arena…</p><progress id="progress" max="1" value="0"></progress><p id="error"></p></div>
<canvas id="unity-canvas" width="1600" height="900" tabindex="-1"></canvas>
<script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading');
const config={dataUrl:'Build/Itch.data.unityweb',frameworkUrl:'Build/Itch.framework.js.unityweb',codeUrl:'Build/Itch.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:"Rude Races",productName:"Nitro Wreckers",productVersion:"1.0",
// Phones report 3x pixel density; rendering that many pixels for a 2D game only costs battery and frames.
devicePixelRatio:Math.min(window.devicePixelRatio||1,2)};
const loader=document.createElement('script');loader.src='Build/Itch.loader.js';
loader.onload=()=>createUnityInstance(canvas,config,p=>document.getElementById('progress').value=p).then(instance=>{window.unityInstance=instance;loading.remove();canvas.focus();}).catch(e=>document.getElementById('error').textContent='Unable to load the arena. Please reload.\n'+e);
loader.onerror=()=>document.getElementById('error').textContent='The game download failed. Please reload.';
document.body.appendChild(loader);
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)&&e.target===canvas)e.preventDefault();});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
